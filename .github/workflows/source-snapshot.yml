name: Source snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install locked dependencies for offline tests
        run: npm ci --prefix web && npm ci --prefix bridge
      - name: Archive tracked source and locked dependencies
        run: |
          git archive --format=tar --output="${RUNNER_TEMP}/hermes-source.tar" HEAD
          tar --append --file="${RUNNER_TEMP}/hermes-source.tar" web/node_modules bridge/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-source-${{ github.sha }}
          path: ${{ runner.temp }}/hermes-source.tar
          retention-days: 1
          if-no-files-found: error
