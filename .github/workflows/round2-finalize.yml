name: Finalize round2 translation work

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/round2-finalize.yml'

permissions:
  contents: write

concurrency:
  group: round2-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/translation-worker-round2-20260912' && github.event.pull_request.base.ref == 'codex/p0-hardening-tauri2'
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: codex/translation-worker-round2-20260912
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Confirm exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
      - name: Record verification and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          section = '''## 2026-09-12：第二轮翻译单入口与 Worker 原子重试（Implemented，未部署）\n\n- 规格：`docs/sdd/13-translation-ingress-and-retry.md`；需求：`FR-AI-015` / `FR-AI-016`。\n- Standalone 自动翻译只由服务端已鉴权 `message.upsert` 入站链路创建；浏览器不再因打开页面、刷新或扫描未译消息自动 POST 翻译批次。显式手动/历史补译端点保留，Legacy 逐条自动翻译保持兼容。\n- 新增统一 `translation_policy`：插件开关、消息自动翻译开关、AI Provider 配置、目标语言和上下文窗口由服务端同一解析器决定；设置 API 与普通用户 capabilities 返回同一有效状态。\n- `TranslationDispatcher` 使用带 `id/status/attempt_count` 守卫的 CAS 原子领取；`attempt_count` 作为领取代次，旧 Worker 迟到结果不会覆盖新一轮任务；可重试失败进入 `pending + retry_after`，到达最大次数后进入 `dead`。\n- 锁定 CI `34681537160`：Python **393 passed / 7 skipped**，Web **141 passed**，Bridge **89 passed**，Ruff/格式、Bridge syntax、Browser/Tauri 两种前端构建与 Tauri shell 校验全部通过。7 skipped 为需外部 PostgreSQL 测试库的 opt-in 专项。\n- 本轮没有数据库迁移，没有修改生产账号、AI 开关、WhatsApp session 或客户数据；gcptw 未部署，因此只能标记 Implemented，不能标 Production Verified。\n- 安装审计仍报告 Web 6 项（2 moderate / 4 high）、Bridge 1 项 high，尚未在本轮升级依赖。\n\n'''
          for name in ['docs/PROJECT_MEMORY.md', 'docs/TODO_AGENT.md', 'docs/DECISIONS.md', 'docs/CHANGELOG_AGENT.md']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if not text.startswith('## 2026-09-12：第二轮翻译单入口'):
                  p.write_text(section + text, encoding='utf-8')

          p = Path('docs/sdd/01-product-requirements.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('**FR-AI-015 [Approved]**', '**FR-AI-015 [Implemented]**')
          text = text.replace('**FR-AI-016 [Approved]**', '**FR-AI-016 [Implemented]**')
          p.write_text(text, encoding='utf-8')

          p = Path('docs/sdd/13-translation-ingress-and-retry.md')
          text = p.read_text(encoding='utf-8').replace(
              '状态：**Approved / Mandatory**',
              '状态：**Implemented / Mandatory（代码门禁通过；生产验收待完成）**',
          )
          p.write_text(text, encoding='utf-8')

          report = Path('docs/reports/2026-09-12-round2-translation-verification.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('''# 第二轮翻译单入口与 Worker 重试：代码验收记录\n\n状态：**Implemented / Code Verified**；**Production Verified 未完成**。\n\n基线：`codex/p0-hardening-tauri2` 的 `474dc0ba86b8351e10515ee5b9849cc349a1bb75`。\n实现提交：`0fd68c63daa7546b358b4fe794a2abd3d435fe93`（PR #8）。\n规格：`FR-AI-015`、`FR-AI-016`、`PERF-004`、`PERF-006`。\n\n## 完成内容\n\n1. Standalone 自动翻译改为服务端入站单入口；浏览器不再自动创建翻译批次，显式手动/历史补译接口保留。\n2. `translation_policy` 统一插件开关、消息自动翻译开关、有效 AI Key、目标语言和窗口配置；设置 API 与 capabilities 复用同一解析器。\n3. TranslationDispatcher 使用条件 UPDATE / CAS 原子领取，`attempt_count` 作为领取代次；迟到 Worker 写回会被拒绝。\n4. 可重试失败进入 `pending + retry_after` 的指数退避；达到 `max_attempts` 转 `dead`。已完成消息在下一轮不会重复调用 AI。\n5. API 增加翻译错误、重试时间、批次 attempt/retry 状态，前端被动呈现服务端真实状态。\n\n## 锁定 CI 证据\n\nGitHub Actions run：`34681537160`，job：`103520944938`。\n\n- Python 3.11.16 / uv 0.9.25 / Ruff 0.15.21 / Node 20.20.2。\n- `uv sync --locked`、`npm ci`。\n- Python：**393 passed / 7 skipped / 1 warning**。\n- Web：**141 passed / 0 failed**。\n- Bridge：**89 passed / 0 failed**，syntax check 通过。\n- Browser production build：通过，主包 `index-Dc6R1fCS.js`。\n- Tauri frontend build：通过，主包 `index-TJ5u0dbq.js`；Tauri shell 校验通过。\n- Ruff check / format check / `git diff --check`：通过。\n\n7 个 skipped 是需要显式外部 PostgreSQL 测试数据库的专项，未声称 PostgreSQL 实库验收。Starlette TestClient 有 1 个 httpx 迁移 deprecation warning。\n\n## 发布边界\n\n- 本轮没有数据库迁移，使用既有 `attempt_count` / `retry_after` / `updated_at`。\n- 没有启用生产自动翻译或自动回复，没有修改密钥、WhatsApp session、客户消息。\n- gcptw 没有在本轮部署；因此不能标记 Production Verified。\n- npm 安装审计仍提示 Web 6 项（2 moderate / 4 high）及 Bridge 1 项 high；需后续根据 advisory 和运行时可达性逐项处理，不能直接 `--force` 升级。\n\n## 下一优先级\n\n1. 消息封装/编辑/未知类型解析，避免合法消息静默丢弃。\n2. 会话真正游标分页和历史同步覆盖范围。\n3. 自动回复生效配置统一（model/prompt/style）与 Outbox lease/结果不确定处理。\n4. 依赖安全 advisory 分析和安全升级。\n''', encoding='utf-8')
          PY

          git rm -f .github/workflows/round2-source.yml .github/workflows/round2-apply.yml .github/workflows/round2-finalize.yml
          rm -f .automation/round2.patch.gz .automation/round2.patch.gz.*
          git add -A .automation docs .github/workflows
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -Ev '^(docs/|\.automation/|\.github/workflows/round2-)')"
      - name: Commit clean verified state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name sharefuture1
          git config user.email 44525097+sharefuture1@users.noreply.github.com
          git commit -m 'docs: record round-two translation verification and remove temporary CI transport'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
