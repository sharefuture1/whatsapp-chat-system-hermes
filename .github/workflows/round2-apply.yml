name: Verify and apply round2 translation patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.automation/round2.patch.gz.*'
      - '.github/workflows/round2-apply.yml'

permissions:
  contents: write

concurrency:
  group: round2-translation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/translation-worker-round2-20260912' && github.event.pull_request.base.ref == 'codex/p0-hardening-tauri2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: codex/translation-worker-round2-20260912
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cat .automation/round2.patch.gz.00 .automation/round2.patch.gz.01 .automation/round2.patch.gz.02 .automation/round2.patch.gz.03 .automation/round2.patch.gz.04 .automation/round2.patch.gz.05 > "$RUNNER_TEMP/round2.patch.gz"
          gzip -t "$RUNNER_TEMP/round2.patch.gz"
          gzip -dc "$RUNNER_TEMP/round2.patch.gz" > "$RUNNER_TEMP/round2.patch"
          echo "cde202f5b2cde29d0988a3d496246e491123adbcce73fe21c2d78fe3afaf3e11  $RUNNER_TEMP/round2.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/round2.patch"
          git apply "$RUNNER_TEMP/round2.patch"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.9.25
          uv sync --locked --group dev
          npm ci
          npm ci --prefix web
          npm ci --prefix bridge
      - name: Format and static quality
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(git diff --name-only --diff-filter=ACMR HEAD -- '*.py')
          if [ "${#python_files[@]}" -gt 0 ]; then
            uv run ruff format "${python_files[@]}"
            uv run ruff check "${python_files[@]}"
            uv run ruff format --check "${python_files[@]}"
          fi
          git diff --check
      - name: Full Python suite
        run: uv run pytest -q
      - name: Full Web and Bridge suites
        run: npm run web:test && npm run bridge:test && npm run lint --prefix bridge
      - name: Browser and Tauri production builds
        run: npm run web:build && npm run web:build:tauri && npm run tauri:validate && npm run tauri -- --version
      - name: Stage only reviewed product sources
        shell: bash
        run: |
          set -euo pipefail
          git add docs src tests web
          git diff --cached --check
          git diff --cached --name-only | while read -r path; do
            case "$path" in docs/*|src/*|tests/*|web/*) ;; *) echo "Unexpected staged path: $path"; exit 1;; esac
          done
      - name: Sync verified source to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name sharefuture1
          git config user.email 44525097+sharefuture1@users.noreply.github.com
          git commit -m 'fix: make standalone translation single-entry and retries lease-safe [FR-AI-015] [FR-AI-016]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
